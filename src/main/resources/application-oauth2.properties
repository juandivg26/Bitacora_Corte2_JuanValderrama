# Perfil "oauth2": login con Google. Al existir este registro, SecurityConfig activa oauth2Login().
# Credenciales en Google Cloud Console -> APIs y servicios -> Credenciales -> ID de cliente OAuth.
# URI de redirección autorizada: http://localhost:8080/login/oauth2/code/google
# Activar: SPRING_PROFILES_ACTIVE=oauth2 con GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET definidos.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
