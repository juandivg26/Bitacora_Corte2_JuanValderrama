# Perfil "ssl": HTTPS con certificado auto-firmado para desarrollo.
# Generar el certificado (no se versiona, ver .gitignore):
#   keytool -genkeypair -alias restaurante -keyalg RSA -keysize 2048 -storetype PKCS12 \
#     -keystore src/main/resources/restaurante.p12 -validity 365 \
#     -dname "CN=localhost, OU=Dev, O=AmericanBites, L=Bogota, S=DC, C=CO"
# Activar: SPRING_PROFILES_ACTIVE=ssl y SSL_KEYSTORE_PASSWORD=<clave del keystore>
server.port=${SSL_PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE_PATH:classpath:restaurante.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=restaurante
