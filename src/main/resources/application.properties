spring.application.name=restaurante-api
server.port=${SERVER_PORT:8080}

# --- PostgreSQL ---
# Las credenciales NO se versionan: se leen de variables de entorno.
# Para desarrollo local crea el archivo .env.properties (ignorado por git) con:
#   DB_PASSWORD=tu_password
# Tambien puedes exportarlas: DB_URL, DB_USERNAME, DB_PASSWORD.
spring.config.import=optional:file:./.env.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/american_bites}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- MongoDB (persistencia NoSQL: log de eventos de pedidos) ---
# Local:
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/american_bites}
# MongoDB Atlas (reemplaza usuario, password y cluster):
# spring.data.mongodb.uri=mongodb+srv://USUARIO:PASSWORD@CLUSTER.mongodb.net/american_bites?retryWrites=true&w=majority

# --- Seguridad JWT ---
# Secreto HS256 (mínimo 256 bits / 32 bytes) y expiración en milisegundos (1 hora por defecto)
jwt.secret=${JWT_SECRET:AmericanBitesSuperSecretKeyParaFirmaDeTokensJWT2026SecureBase64FormattedKey=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- OAuth2 con Google (Opcional - configurar variables de entorno para activar) ---
# spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
# spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
