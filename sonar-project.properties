# --- SonarQube / SonarCloud ---
# Ejecutar despues de las pruebas para que exista el reporte de JaCoCo:
#   mvn clean test sonar:sonar
#
# Dependiendo del servidor, exporta antes SONAR_TOKEN y descomenta:
#   SonarCloud :  sonar.host.url=https://sonarcloud.io  +  sonar.organization=tu-organizacion
#   SonarQube local (Docker en http://localhost:9000):  sonar.host.url=http://localhost:9000

sonar.projectKey=edu.dosw.restaurante_Bitacora_Corte2_JuanValderrama
sonar.projectName=American Bites - API Restaurante (DOSW Corte 2)
sonar.projectVersion=1.0-SNAPSHOT

# Codigo fuente y pruebas
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.sourceEncoding=UTF-8
sonar.java.source=21

# Clases compiladas que necesita el analisis de Java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Excluir del analisis lo que no es codigo de la aplicacion
sonar.exclusions=target/**,src/main/resources/static/**

# Cobertura y resultados de pruebas generados por Maven (JaCoCo + Surefire)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports
