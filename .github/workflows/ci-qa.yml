# CI/CD Pipeline para ambiente QA
# push a main/develop -> pruebas + imagen Docker + despliegue automático en Azure QA.
# pull_request a main -> solo pruebas (no publica imagen ni despliega código sin revisar).
name: CI - Build · Test · Deploy QA

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/american-bites-api

jobs:
  # Job 1: Ejecutar pruebas unitarias y de integración
  test:
    name: 🧪 Pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas con Maven
        run: mvn -B test --no-transfer-progress

      - name: Publicar reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-qa
          path: target/site/jacoco/
          retention-days: 7

  # Job 2: Build de la imagen Docker y push a Docker Hub
  build-and-push:
    name: 🐳 Build y Push Docker
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Genera los tags qa-<sha del commit> y qa-latest. Se despliega el tag por SHA
      # para que Azure siempre tome exactamente la imagen recién construida.
      - name: Extraer metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=qa-,format=long
            type=raw,value=qa-latest

      - name: Build y push de la imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 3: Despliegue a Azure App Service QA
  deploy-qa:
    name: 🚀 Desplegar a QA
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: qa
      url: https://${{ vars.AZURE_WEBAPP_NAME_QA }}.azurewebsites.net/swagger-ui/index.html
    steps:
      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Las variables se configuran antes del despliegue para que el contenedor arranque ya con ellas.
      # Los nombres coinciden con los que lee application-docker.yml.
      - name: Configurar variables de entorno en Azure QA
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_QA }}
          app-settings-json: |
            [
              {"name": "SPRING_PROFILES_ACTIVE", "value": "docker", "slotSetting": false},
              {"name": "SERVER_PORT", "value": "8080", "slotSetting": false},
              {"name": "WEBSITES_PORT", "value": "8080", "slotSetting": false},
              {"name": "JWT_SECRET", "value": "${{ secrets.JWT_SECRET_QA }}", "slotSetting": false},
              {"name": "DB_HOST", "value": "${{ secrets.DB_HOST_QA }}", "slotSetting": false},
              {"name": "DB_PORT", "value": "5432", "slotSetting": false},
              {"name": "DB_NAME", "value": "american_bites", "slotSetting": false},
              {"name": "DB_USER", "value": "${{ secrets.DB_USER_QA }}", "slotSetting": false},
              {"name": "DB_PASSWORD", "value": "${{ secrets.DB_PASSWORD_QA }}", "slotSetting": false},
              {"name": "DB_SSLMODE", "value": "require", "slotSetting": false},
              {"name": "MONGODB_URI", "value": "${{ secrets.MONGODB_URI_QA }}", "slotSetting": false},
              {"name": "MONGO_DB", "value": "american_bites", "slotSetting": false},
              {"name": "JPA_DDL_AUTO", "value": "update", "slotSetting": false},
              {"name": "JPA_SHOW_SQL", "value": "false", "slotSetting": false}
            ]

      - name: Desplegar en Azure Web App (QA)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_QA }}
          images: docker.io/${{ env.IMAGE_NAME }}:qa-${{ github.sha }}

      - name: Mostrar URL del despliegue
        run: |
          echo "✅ API desplegada en QA:"
          echo "   https://${{ vars.AZURE_WEBAPP_NAME_QA }}.azurewebsites.net/swagger-ui/index.html"
